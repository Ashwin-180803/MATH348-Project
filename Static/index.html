<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Curves Calculator</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Curves & Surfaces — Interactive Calculator</h1>

    <div class="controls">
      <label for="curve">Choose curve:</label>
      <select id="curve">
        <option value="helix">Helix</option>
        <option value="circle">Circle</option>
        <option value="ellipse">Ellipse</option>
        <option value="line">Line</option>
        <option value="cycloid">Cycloid</option>
        <option value="twisted_cubic">Twisted cubic</option>
        <option value="catenary">Catenary</option>
        <option value="hyperbola">Hyperbola</option>
        <option value="tractrix">Tractrix</option>
      </select>

      <div id="params"></div>

      <label>t range:</label>
      <input id="t0" type="number" step="any" value="0"> to
      <input id="t1" type="number" step="any" value="6.283185307179586">

      <label>Points (n):</label>
      <input id="n" type="number" value="400" min="10" max="5000">

      <button id="compute">Compute & Plot</button>
    </div>

    <div id="results">
      <div id="plot" class="plot"></div>
      <div id="info" class="info"></div>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
